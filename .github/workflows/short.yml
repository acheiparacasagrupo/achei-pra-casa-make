name: Novo Short (Achei pra Casa)

on:
  schedule:                      # 3 Shorts por dia (horário de Brasília)
    - cron: "40 13 * * *"        # 10:40
    - cron: "10 19 * * *"        # 16:10
    - cron: "20 23 * * *"        # 20:20
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = só gera o vídeo (baixe em Artifacts), não publica"
        default: "false"

permissions:
  contents: write

concurrency:
  group: novo-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg, Python e navegador
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar Short e enviar para o Make
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          VOZ: ${{ vars.VOZ }}
          GRUPO_WHATSAPP: ${{ vars.GRUPO_WHATSAPP }}
        run: python main.py

      - name: Guardar vídeo gerado (aba Actions > Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            tmp/short.mp4
            tmp/roteiro.json
            tmp/diag_*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico (não repetir produto)
        run: |
          git config user.name "achei-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || (git commit -m "historico: novo short" && git pull --rebase && git push)
