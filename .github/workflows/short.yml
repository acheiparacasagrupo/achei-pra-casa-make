name: Novo Short (Achei pra Casa)

on:
  schedule:                      # 7 Shorts por dia (horário de Brasília = UTC-3)
    - cron: "20 11 * * *"        # 08:20
    - cron: "20 13 * * *"        # 10:20
    - cron: "20 15 * * *"        # 12:20
    - cron: "20 17 * * *"        # 14:20
    - cron: "20 19 * * *"        # 16:20
    - cron: "20 21 * * *"        # 18:20
    - cron: "20 23 * * *"        # 20:20
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = só gera o vídeo (baixe em Artifacts), não publica"
        default: "false"

permissions:
  contents: write
  models: read

concurrency:
  group: grava-repo
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Gerar Short e enviar para o Make
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          VOZ: ${{ vars.VOZ }}
          GRUPO_WHATSAPP: ${{ vars.GRUPO_WHATSAPP }}
        run: python main.py

      - name: Guardar vídeo gerado (aba Actions > Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            tmp/short.mp4
            tmp/roteiro.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico (não repetir produto)
        if: always()
        run: |
          git config user.name "achei-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 -c "import json;h={x['id'] for x in json.load(open('historico.json'))};f=json.load(open('fila.json'));json.dump([p for p in f if p['id'] not in h],open('fila.json','w'),ensure_ascii=False,indent=2)"
          git add historico.json fila.json
          git diff --cached --quiet || (git commit -m "historico: novo short" && git pull --rebase && git push)
